<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <title>한진피엘 변동점 관리 R5.4</title>
    
    <!-- 
    ========================================
    한진피엘 변동점 관리 시스템
    Version: R5.4
    Last Updated: 2026-04-21
    
    변경사항 (R5.3 → R5.4):
    - 모바일 전체화면 최적화
    - PWA 메타 태그 추가
    - 홈 화면 추가 시 앱처럼 실행
    
    변경사항 (R5.2 → R5.3):
    - 로그인 유지 기능 추가
    - 자동 로그인 지원
    - 로컬 스토리지 기반 세션 유지
    
    변경사항 (R5.1 → R5.2):
    - 분류/항목 정확한 명칭으로 전면 수정
    - "공정/ 조건" → "공장/ 조건"
    - "소모품/용액관리" → "소모품/윤활관리"
    - "E/3차사" → "2/3차사"
    - 모든 항목 오타 수정 완료
    
    주요 기능:
    - 7개 분류 체계 (17개 항목)
    - 분류/항목 2단계 선택
    - 발생부서, 담당자 입력
    - Google Sheets 자동 저장
    - 실시간 대시보드 + 그래프
    - 테이블 형식 내역
    ========================================
    -->
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }
        
        .hidden { display: none !important; }
        
        /* 로그인 화면 */
        #loginScreen {
            min-height: 100vh;
            background: #f5f5f5;
            padding: 20px;
        }
        
        .local-badge {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            margin-bottom: 40px;
        }
        
        .local-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #14b8a6;
        }
        
        .local-text {
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
        }
        
        .logo-section {
            text-align: center;
            margin: 40px 0;
        }
        
        .company-name {
            font-size: 20px;
            color: #64748b;
            font-weight: 400;
            margin-top: 24px;
            margin-bottom: 8px;
        }
        
        .app-title {
            font-size: 30px;
            font-weight: 900;
            color: #1e293b;
            margin: 0;
        }
        
        .welcome-text {
            font-size: 20px;
            color: #14b8a6;
            margin-top: 16px;
            font-weight: 500;
        }
        
        .login-form {
            margin-top: 40px;
        }
        
        .form-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 24px;
        }
        
        .input-group {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border: 1px solid #e2e8f0;
            margin-bottom: 16px;
        }
        
        .input-group input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            color: #1e293b;
            background: transparent;
        }
        
        .input-icon {
            color: #14b8a6;
            font-size: 20px;
        }
        
        .login-btn {
            width: 100%;
            padding: 18px;
            background: #14b8a6;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(20, 184, 166, 0.3);
            margin-top: 24px;
        }
        
        .remember-me {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 16px;
            padding: 0 4px;
        }
        
        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #14b8a6;
        }
        
        .remember-me label {
            font-size: 14px;
            color: #64748b;
            cursor: pointer;
            user-select: none;
        }
        
        /* 메인 화면 */
        #mainScreen {
            min-height: 100vh;
            background: linear-gradient(to bottom, #0f172a, #1e293b);
            padding-bottom: 80px;
        }
        
        .header {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 16px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header-title {
            font-size: 20px;
            font-weight: 800;
            color: #f8fafc;
        }
        
        .header-subtitle {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 4px;
        }
        
        .logout-btn {
            padding: 8px 16px;
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            color: #ef4444;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .content {
            padding: 20px;
        }
        
        .page-title {
            font-size: 24px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 24px;
        }
        
        .category-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .category-btn {
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #f8fafc;
            cursor: pointer;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s;
        }
        
        .category-btn.selected {
            transform: scale(1.05);
        }
        
        .form-label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-size: 14px;
            font-weight: 600;
        }
        
        .form-input, .form-textarea {
            width: 100%;
            padding: 14px;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            color: #f8fafc;
            font-size: 16px;
            outline: none;
            margin-bottom: 20px;
        }
        
        .form-textarea {
            resize: vertical;
            font-family: inherit;
        }
        
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.4);
        }
        
        .change-point-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        .change-point-header {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .change-point-icon {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 24px;
        }
        
        .change-point-info {
            flex: 1;
        }
        
        .change-point-category {
            font-size: 16px;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 4px;
        }
        
        .change-point-time {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 8px;
        }
        
        .change-point-description {
            font-size: 15px;
            color: #e2e8f0;
            line-height: 1.5;
        }
        
        .change-point-meta {
            margin-top: 12px;
            font-size: 13px;
            color: #94a3b8;
        }
        
        .share-btn {
            width: 100%;
            padding: 10px;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            color: #3b82f6;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 12px;
        }
        
        .stat-card {
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 12px;
        }
        
        .stat-label {
            font-size: 14px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 8px;
        }
        
        .stat-value {
            font-size: 36px;
            font-weight: 800;
            color: #fff;
        }
        
        .stat-unit {
            font-size: 13px;
            color: rgba(255,255,255,0.7);
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            z-index: 100;
        }
        
        .nav-btn {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            background: none;
            border: none;
            color: #64748b;
            cursor: pointer;
            padding: 8px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .nav-btn.active {
            color: #3b82f6;
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #64748b;
        }
        
        .backup-section {
            background: rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        .backup-buttons {
            display: flex;
            gap: 12px;
        }
        
        .backup-btn {
            flex: 1;
            padding: 12px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        
        .backup-export {
            background: rgba(34, 197, 94, 0.2);
            border: 2px solid #22c55e;
            color: #22c55e;
        }
        
        .backup-import {
            background: rgba(59, 130, 246, 0.2);
            border: 2px solid #3b82f6;
            color: #3b82f6;
        }
        
        .backup-warning {
            margin-top: 12px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>

        function login() {
            const employeeId = document.getElementById('employeeId').value;
            const password = document.getElementById('password').value;
            
            if (!employeeId || !password) {
                alert('사번과 비밀번호를 입력해주세요.');
                return;
            }
            
            // 로그인 버튼 비활성화 및 로딩 표시
            const loginBtn = document.querySelector('.login-btn');
            const originalText = loginBtn.textContent;
            loginBtn.disabled = true;
            loginBtn.textContent = '로그인 중...';
            loginBtn.style.opacity = '0.6';
            
            // JSONP 방식으로 CORS 우회
            const callbackName = 'loginCallback_' + Date.now();
            
            window[callbackName] = function(data) {
                // 버튼 복구
                loginBtn.disabled = false;
                loginBtn.textContent = originalText;
                loginBtn.style.opacity = '1';
                
                if (data.result === 'success') {
                    // 로그인 성공
                    currentUser = { name: data.name, employeeId: employeeId, department: data.department || '' };
                    document.getElementById('userInfo').textContent = `${currentUser.name} (${currentUser.employeeId})`;
                    document.getElementById('inputManager').value = currentUser.name;
                    document.getElementById('inputDepartment').value = currentUser.department; // 발생부서 자동 입력
                    
                    // 로그인 유지 체크 시 로컬 스토리지에 저장
                    const rememberMe = document.getElementById('rememberMe').checked;
                    if (rememberMe) {
                        localStorage.setItem('savedEmployeeId', employeeId);
                        localStorage.setItem('savedPassword', password);
                        localStorage.setItem('rememberMe', 'true');
                    } else {
                        // 체크 해제 시 저장된 정보 삭제
                        localStorage.removeItem('savedEmployeeId');
                        localStorage.removeItem('savedPassword');
                        localStorage.removeItem('rememberMe');
                    }
                    
                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('mainScreen').classList.remove('hidden');
                    
                    renderClassifications();  // renderCategories → renderClassifications
                    updateStats();
                } else {
                    // 로그인 실패
                    alert('사번 또는 비밀번호가 올바르지 않습니다.');
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
                
                // 콜백 정리
                delete window[callbackName];
                document.head.removeChild(script);
            };
            
            // script 태그를 동적으로 추가하여 JSONP 요청
            const script = document.createElement('script');
            script.src = `${GAS_URL}?id=${encodeURIComponent(employeeId)}&pw=${encodeURIComponent(password)}&callback=${callbackName}`;
            script.onerror = function() {
                // 버튼 복구
                loginBtn.disabled = false;
                loginBtn.textContent = originalText;
                loginBtn.style.opacity = '1';
                
                alert('로그인 중 오류가 발생했습니다.\n\nGAS 웹 앱이 올바르게 배포되었는지 확인하세요.');
                delete window[callbackName];
                document.head.removeChild(script);
            };
            
            document.head.appendChild(script);
        }

        // 카테고리별 추이 그래프 그리기
        function drawCategoryChart(dailyStats, dates) {
            const chartContainer = document.getElementById('categoryChart');
            
            if (!dailyStats || !dates || dates.length === 0) {
                chartContainer.innerHTML = '<div style="display: flex; align-items: center; justify-content: center; height: 100%; color: #94a3b8;">데이터가 없습니다</div>';
                return;
            }
            
            // 카테고리별 색상 (categories 배열에서 가져오기)
            const categoryColors = {};
            categories.forEach(cat => {
                categoryColors[cat.name] = cat.color;
            });
            
            // 모든 카테고리 목록 추출
            const allCategories = new Set();
            Object.values(dailyStats).forEach(dayData => {
                Object.keys(dayData).forEach(cat => allCategories.add(cat));
            });
            
            // 카테고리별 데이터 배열 생성
            const categoryData = {};
            allCategories.forEach(cat => {
                categoryData[cat] = dates.map(date => dailyStats[date][cat] || 0);
            });
            
            // SVG 그래프 그리기
            const width = chartContainer.offsetWidth;
            const height = 300;
            const padding = { top: 20, right: 100, bottom: 50, left: 40 };
            const chartWidth = width - padding.left - padding.right;
            const chartHeight = height - padding.top - padding.bottom;
            
            // 최대값 계산
            let maxValue = 0;
            Object.values(categoryData).forEach(data => {
                const max = Math.max(...data);
                if (max > maxValue) maxValue = max;
            });
            maxValue = maxValue || 10; // 최소값 10
            
            // SVG 생성
            let svg = `<svg width="${width}" height="${height}" style="background: transparent;">`;
            
            // 격자선
            for (let i = 0; i <= 5; i++) {
                const y = padding.top + (chartHeight / 5) * i;
                svg += `<line x1="${padding.left}" y1="${y}" x2="${width - padding.right}" y2="${y}" stroke="#334155" stroke-width="1" stroke-dasharray="3,3"/>`;
                svg += `<text x="${padding.left - 8}" y="${y + 4}" fill="#64748b" font-size="11" text-anchor="end">${Math.round(maxValue * (5 - i) / 5)}</text>`;
            }
            
            // X축 레이블 (날짜)
            dates.forEach((date, i) => {
                const x = padding.left + (chartWidth / (dates.length - 1)) * i;
                const label = date.slice(5); // MM-DD 형식
                svg += `<text x="${x}" y="${height - padding.bottom + 20}" fill="#64748b" font-size="11" text-anchor="middle">${label}</text>`;
            });
            
            // 카테고리별 선 그리기
            Object.entries(categoryData).forEach(([category, data]) => {
                const color = categoryColors[category] || '#64748b';
                
                // 데이터 포인트 좌표 계산
                const points = data.map((value, i) => {
                    const x = padding.left + (chartWidth / (dates.length - 1)) * i;
                    const y = padding.top + chartHeight - (value / maxValue * chartHeight);
                    return { x, y, value };
                });
                
                // 선 그리기
                const pathData = points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
                svg += `<path d="${pathData}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
                
                // 점 그리기
                points.forEach(p => {
                    svg += `<circle cx="${p.x}" cy="${p.y}" r="4" fill="${color}" stroke="#0f172a" stroke-width="2"/>`;
                    if (p.value > 0) {
                        svg += `<text x="${p.x}" y="${p.y - 10}" fill="${color}" font-size="11" font-weight="600" text-anchor="middle">${p.value}</text>`;
                    }
                });
            });
            
            // 범례 그리기
            let legendY = padding.top;
            Object.entries(categoryData).forEach(([category, data], index) => {
                const color = categoryColors[category] || '#64748b';
                const total = data.reduce((a, b) => a + b, 0);
                
                svg += `<circle cx="${width - padding.right + 15}" cy="${legendY}" r="5" fill="${color}"/>`;
                svg += `<text x="${width - padding.right + 25}" y="${legendY + 4}" fill="#f8fafc" font-size="12">${category.split(' ')[0]} (${total})</text>`;
                legendY += 25;
            });
            
            svg += '</svg>';
            
            chartContainer.innerHTML = svg;
        }
        
        function exportData() {
            const dataStr = JSON.stringify(changePoints, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `변동점데이터_${new Date().toISOString().split('T')[0]}.json`;
            link.click();
        }
        
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    changePoints = JSON.parse(e.target.result);
                    updateStats();
                    alert('데이터를 불러왔습니다.');
                } catch (error) {
                    alert('파일을 읽을 수 없습니다.');
                }
            };
            reader.readAsText(file);
        }
        
        // Enter 키로 로그인 + 자동 로그인
        document.addEventListener('DOMContentLoaded', () => {
            // Enter 키 이벤트
            document.getElementById('employeeId').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });
            document.getElementById('password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') login();
            });
            
            // 자동 로그인 체크
            const savedEmployeeId = localStorage.getItem('savedEmployeeId');
            const savedPassword = localStorage.getItem('savedPassword');
            const rememberMe = localStorage.getItem('rememberMe') === 'true';
            
            if (rememberMe && savedEmployeeId && savedPassword) {
                // 저장된 정보 입력 필드에 자동 입력
                document.getElementById('employeeId').value = savedEmployeeId;
                document.getElementById('password').value = savedPassword;
                document.getElementById('rememberMe').checked = true;
                
                // 자동 로그인 실행
                setTimeout(() => {
                    login();
                }, 500); // 0.5초 후 자동 로그인 (UI 준비 대기)
            }
        });
    </script>
</body>
</html>
